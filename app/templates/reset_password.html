{% extends "base.html" %}

{% block title %}Reset Password - SMTP Proxy Admin{% endblock %}

{% block content %}
<div class="max-w-md w-full mx-auto px-4">
    <div class="card p-8 shadow-skeleton">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset Password</h1>
            <p class="text-gray-600">Enter your new password</p>
        </div>

        <form method="POST" action="/admin/reset-password/{{ token }}" class="space-y-6">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    New Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    class="w-full px-3 py-2 rounded-md"
                    placeholder="Enter new password"
                    autofocus
                >
                <p class="mt-1 text-xs text-gray-500">Minimum 8 characters</p>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="8"
                    class="w-full px-3 py-2 rounded-md"
                    placeholder="Confirm new password"
                >
            </div>

            <div>
                <button
                    type="submit"
                    class="btn btn-primary w-full px-4 py-2 rounded-md font-medium"
                >
                    Reset Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;

        if (password !== confirm) {
            e.preventDefault();
            alert('Passwords do not match!');
        }
    });
</script>
{% endblock %}
