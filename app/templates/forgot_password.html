{% extends "base.html" %}

{% block title %}Forgot Password - SMTP Proxy Admin{% endblock %}

{% block content %}
<div class="max-w-md w-full mx-auto px-4">
    <div class="card p-8 shadow-skeleton">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Forgot Password</h1>
            <p class="text-gray-600">Enter your email to receive a reset link</p>
        </div>

        <form method="POST" action="/admin/forgot-password" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="w-full px-3 py-2 rounded-md"
                    placeholder="Enter your email"
                    autofocus
                >
            </div>

            <div>
                <button
                    type="submit"
                    class="btn btn-primary w-full px-4 py-2 rounded-md font-medium"
                >
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <a href="/admin/login" class="text-sm text-gray-700 hover:text-gray-900 underline">
                    Back to Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
